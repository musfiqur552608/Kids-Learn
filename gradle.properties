# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
org.gradle.parallel=true
# When enabled, the Configuration Cache allows Gradle to skip configuration
# and task graph calculation if the build scripts and inputs are unchanged.
org.gradle.configuration-cache=true
# Build cache: reuses task outputs across clean builds (big win for CI).
org.gradle.caching=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# AGP 9 ships "built-in Kotlin" (it owns the `kotlin { }` extension), which is why
# this project does NOT apply `org.jetbrains.kotlin.android` — doing so registers a
# second, conflicting `kotlin` extension and the build fails to configure.
#
# KSP 2.x still registers its generated sources through the `kotlin.sourceSets` DSL,
# which built-in Kotlin forbids. The officially documented escape hatch is to opt
# back in; AGP then routes KSP's output through `android.sourceSets` instead.
android.disallowKotlinSourceSets=false

# Only package the resources/drawables actually referenced (see buildTypes.release).
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
